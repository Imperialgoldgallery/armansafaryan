<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Դոկտոր Արման Սաֆարյան | Դիմածնոտային Վիրաբույժ</title>
  <meta name="description" content="Դոկտոր Արման Սաֆարյանի պաշտոնական պորտֆոլիո։ Դիմածնոտային վիրաբուժություն, ստոմատոլոգիա, շտապ օգնություն։">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0a4d68;
      --secondary: #088395;
      --accent: #05bfdb;
      --light: #f4f9fc;
      --dark: #0b1c2c;
      --text: #334155;
      --text-light: #64748b;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(10, 77, 104, 0.08);
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans Armenian', 'Inter', sans-serif;
      color: var(--text);
      background: var(--light);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Header & Nav */
    header {
      position: fixed; top: 0; width: 100%; z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    nav {
      max-width: 1200px; margin: 0 auto; padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo { font-weight: 700; font-size: 1.25rem; color: var(--primary); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      text-decoration: none; color: var(--text); font-weight: 500;
      transition: var(--transition); position: relative;
    }
    .nav-links a:hover { color: var(--secondary); }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px;
      background: var(--accent); transition: var(--transition);
    }
    .nav-links a:hover::after { width: 100%; }

    .menu-toggle { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--primary); }

    /* Hero */
    .hero {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 6rem 2rem 4rem; background: linear-gradient(135deg, var(--light) 0%, #e6f2f8 100%);
    }
    .hero-container {
      max-width: 1100px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;
    }
    .hero-text h1 { font-size: clamp(2rem, 5vw, 3.2rem); color: var(--primary); margin-bottom: 0.5rem; line-height: 1.2; }
    .hero-text h2 { font-size: 1.25rem; color: var(--secondary); font-weight: 500; margin-bottom: 1.5rem; }
    .hero-text p { margin-bottom: 2rem; color: var(--text-light); font-size: 1.05rem; }
    .btn {
      display: inline-block; padding: 0.85rem 1.8rem; background: var(--primary); color: var(--white);
      text-decoration: none; border-radius: 50px; font-weight: 600; transition: var(--transition);
      border: 2px solid transparent;
    }
    .btn:hover { background: transparent; border-color: var(--primary); color: var(--primary); }
    .btn-outline { background: transparent; color: var(--primary); border-color: var(--primary); margin-left: 1rem; }
    .btn-outline:hover { background: var(--primary); color: var(--white); }

    .hero-img { display: flex; justify-content: center; }
    .profile-img {
      width: 320px; height: 320px; object-fit: cover; border-radius: 50%;
      border: 6px solid var(--white); box-shadow: var(--shadow);
      background: #cbd5e1; /* fallback */
    }

    /* Sections */
    section { padding: 5rem 2rem; }
    .section-title {
      text-align: center; font-size: 2.2rem; color: var(--primary); margin-bottom: 1rem;
    }
    .section-subtitle { text-align: center; color: var(--text-light); margin-bottom: 3rem; max-width: 600px; margin-inline: auto; }
    .container { max-width: 1100px; margin: 0 auto; }

    /* About & Info Grid */
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
    .info-card {
      background: var(--white); padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .info-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(10, 77, 104, 0.12); }
    .info-card h3 { color: var(--secondary); margin-bottom: 0.5rem; font-size: 1.1rem; }
    .info-card p { color: var(--text); font-size: 0.95rem; }

    /* Timeline */
    .timeline { position: relative; max-width: 800px; margin: 0 auto; padding-left: 2rem; }
    .timeline::before {
      content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background: var(--accent); border-radius: 3px;
    }
    .timeline-item { position: relative; margin-bottom: 2.5rem; padding-left: 1.5rem; }
    .timeline-item::before {
      content: ''; position: absolute; left: -2.5rem; top: 6px; width: 12px; height: 12px;
      background: var(--secondary); border: 3px solid var(--white); border-radius: 50%; z-index: 1;
    }
    .timeline-date { font-weight: 600; color: var(--accent); font-size: 0.9rem; margin-bottom: 0.3rem; }
    .timeline-title { font-weight: 700; color: var(--primary); margin-bottom: 0.2rem; }
    .timeline-desc { color: var(--text-light); font-size: 0.95rem; }

    /* Skills */
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; }
    .skill-category { background: var(--white); padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); }
    .skill-category h3 { color: var(--primary); margin-bottom: 1rem; border-bottom: 2px solid var(--light); padding-bottom: 0.5rem; }
    .skill-list { list-style: none; }
    .skill-list li {
      padding: 0.5rem 0; border-bottom: 1px dashed #e2e8f0; display: flex; justify-content: space-between; align-items: center;
    }
    .skill-list li:last-child { border-bottom: none; }
    .badge { background: var(--light); color: var(--secondary); padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

    .contact-wrapper {
      background: var(--white); padding: 3rem; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center;
